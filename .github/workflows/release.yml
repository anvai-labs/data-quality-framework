name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Poetry
        run: pip install poetry==2.4.2
      - name: Install dependencies
        run: poetry install --with dev -E spark -E deequ -E aws -E databricks
      - name: Download Deequ JAR
        run: |
          mkdir -p lib
          curl --fail --location --silent --show-error \
            https://repo1.maven.org/maven2/com/amazon/deequ/deequ/2.0.21-spark-3.5/deequ-2.0.21-spark-3.5.jar \
            --output lib/deequ-2.0.21-spark-3.5.jar
          curl --fail --location --silent --show-error \
            https://repo1.maven.org/maven2/software/amazon/glue/dqdl/1.0.0/dqdl-1.0.0.jar \
            --output lib/dqdl-1.0.0.jar
      - name: Test and enforce coverage
        timeout-minutes: 10
        run: |
          poetry run pytest dq/tests/ -v --tb=short \
            --cov=dq --cov-branch --cov-report=term-missing \
            --cov-report=json:coverage.json --cov-fail-under=55
          poetry run python scripts/check_coverage.py coverage.json \
            --min-line 57 --min-branch 46
        env:
          SPARK_VERSION: "3.5"
      - name: Build package
        run: poetry build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
