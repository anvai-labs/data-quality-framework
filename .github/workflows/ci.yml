name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: >-
      github.event_name != 'pull_request' ||
      vars.OWNER_PRIVATE_CI_ENABLED != 'true' ||
      github.actor_id != '5168752' ||
      github.event.pull_request.user.id != 5168752 ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install Poetry
        run: pip install poetry==2.4.2
      - name: Install dependencies
        run: poetry install --with dev
      - name: Check formatting
        run: poetry run black --check dq/
      - name: Lint
        run: >-
          poetry run flake8 dq/ --exclude=dq/notebooks
          --select E9,F63,F7,F82
      - name: Security scan
        run: poetry run bandit -r dq/ -x tests -s B101 -lll -q
      - name: Dependency audit
        run: poetry run pip-audit --skip-editable

  test:
    if: >-
      github.event_name != 'pull_request' ||
      vars.OWNER_PRIVATE_CI_ENABLED != 'true' ||
      github.actor_id != '5168752' ||
      github.event.pull_request.user.id != 5168752 ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: "3.12"
            coverage_min: "55"
          - python-version: "3.13"
            coverage_min: "55"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "11"
      - name: Install Poetry
        run: pip install poetry==2.4.2
      - name: Install dependencies
        run: poetry install --with dev -E spark -E deequ -E aws -E databricks
      - name: Download Deequ JAR
        run: |
          mkdir -p lib
          wget -q -O lib/deequ-2.0.8-spark-3.5.jar \
            https://repo1.maven.org/maven2/com/amazon/deequ/deequ/2.0.8-spark-3.5/deequ-2.0.8-spark-3.5.jar
      - name: Run tests
        run: >-
          poetry run pytest dq/tests/ -v --tb=short
          --cov=dq --cov-branch --cov-report=term-missing
          --cov-report=xml --cov-report=json:coverage.json
          --cov-fail-under=${{ matrix.coverage_min }}
        env:
          SPARK_VERSION: "3.5"
      - name: Enforce independent line and branch floors
        if: matrix.python-version == '3.13'
        run: >-
          poetry run python scripts/check_coverage.py coverage.json
          --min-line 57 --min-branch 46
      - name: Enforce changed-code coverage
        if: matrix.python-version == '3.13' && github.event_name == 'pull_request'
        run: poetry run diff-cover coverage.xml --compare-branch=origin/${{ github.base_ref }} --fail-under=90

  dependency-review:
    name: Dependency review
    if: >-
      github.event_name == 'pull_request' &&
      (vars.OWNER_PRIVATE_CI_ENABLED != 'true' ||
      github.actor_id != '5168752' ||
      github.event.pull_request.user.id != 5168752 ||
      github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check documentation links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --root-dir . --max-retries 3 --timeout 30
            --exclude '^file:///(absolute/path|path/to)/'
            './**/*.md' './**/*.adoc'
          fail: true
          failIfEmpty: false
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  build:
    name: build
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
      vars.OWNER_PRIVATE_CI_ENABLED != 'true' ||
      github.actor_id != '5168752' ||
      github.event.pull_request.user.id != 5168752 ||
      github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    needs: [lint, test, dependency-review]
    steps:
      - name: Verify required jobs
        env:
          EVENT_NAME: ${{ github.event_name }}
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
        run: |
          set -euo pipefail
          test "${LINT_RESULT}" = "success"
          test "${TEST_RESULT}" = "success"
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            test "${DEPENDENCY_REVIEW_RESULT}" = "success"
          else
            test "${DEPENDENCY_REVIEW_RESULT}" = "skipped"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install Poetry
        run: pip install poetry==2.4.2
      - name: Build package
        run: poetry build
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
