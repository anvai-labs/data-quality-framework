name: Owner Private CI

# This workflow is loaded only from the protected base branch. Pull requests do
# not control its runner selection or steps. The identity checks are evaluated
# by GitHub before a self-hosted runner is assigned.
on:
  pull_request_target:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: owner-private-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  OWNER_GITHUB_USER_ID: "5168752"

jobs:
  authorize-owner:
    name: Authorize owner private CI
    environment: owner-private-ci
    if: >-
      vars.OWNER_PRIVATE_CI_ENABLED == 'true' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.id == 5168752 &&
      github.actor_id == '5168752' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, public-overflow]
    timeout-minutes: 5
    steps:
      - name: Verify immutable owner and same-repository head
        env:
          ACTOR_ID: ${{ github.actor_id }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_AUTHOR_ID: ${{ github.event.pull_request.user.id }}
        run: |
          set -euo pipefail
          test "${ACTOR_ID}" = "${OWNER_GITHUB_USER_ID}"
          test "${PR_AUTHOR_ID}" = "${OWNER_GITHUB_USER_ID}"
          test "${HEAD_REPOSITORY}" = "${GITHUB_REPOSITORY}"

  owner-lint:
    name: Owner lint
    needs: authorize-owner
    runs-on: [self-hosted, Linux, X64, public-overflow]
    timeout-minutes: 20
    steps:
      - name: Verify trusted PR identity
        env:
          ACTOR_ID: ${{ github.actor_id }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_AUTHOR_ID: ${{ github.event.pull_request.user.id }}
        run: |
          set -euo pipefail
          test "${ACTOR_ID}" = "${OWNER_GITHUB_USER_ID}"
          test "${PR_AUTHOR_ID}" = "${OWNER_GITHUB_USER_ID}"
          test "${HEAD_REPOSITORY}" = "${GITHUB_REPOSITORY}"

      - name: Check out the exact trusted PR revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          clean: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pip install poetry==2.4.2

      - name: Install dependencies
        run: poetry install --with dev

      - name: Check formatting
        run: poetry run black --check dq/

      - name: Validate example without optional engine dependencies
        run: poetry run dq-validate examples/basic_deequ_validation.conf

      - name: Lint
        run: >-
          poetry run flake8 dq/ --exclude=dq/notebooks
          --select E9,F63,F7,F82

      - name: Security scan
        run: poetry run bandit -r dq/ -x tests -s B101 -lll -q

      - name: Dependency audit
        run: poetry run pip-audit --skip-editable

  owner-test:
    name: Owner test (Python ${{ matrix.python-version }})
    needs: authorize-owner
    runs-on: [self-hosted, Linux, X64, public-overflow]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - python-version: "3.12"
            coverage_min: "55"
          - python-version: "3.13"
            coverage_min: "55"
    steps:
      - name: Verify trusted PR identity
        env:
          ACTOR_ID: ${{ github.actor_id }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_AUTHOR_ID: ${{ github.event.pull_request.user.id }}
        run: |
          set -euo pipefail
          test "${ACTOR_ID}" = "${OWNER_GITHUB_USER_ID}"
          test "${PR_AUTHOR_ID}" = "${OWNER_GITHUB_USER_ID}"
          test "${HEAD_REPOSITORY}" = "${GITHUB_REPOSITORY}"

      - name: Check out the exact trusted PR revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Poetry
        run: pip install poetry==2.4.2

      - name: Install dependencies
        run: poetry install --with dev -E spark -E deequ -E aws -E databricks

      - name: Download Deequ JAR
        run: |
          mkdir -p lib
          wget -q -O lib/deequ-2.0.21-spark-3.5.jar \
            https://repo1.maven.org/maven2/com/amazon/deequ/deequ/2.0.21-spark-3.5/deequ-2.0.21-spark-3.5.jar
          wget -q -O lib/dqdl-1.0.0.jar \
            https://repo1.maven.org/maven2/software/amazon/glue/dqdl/1.0.0/dqdl-1.0.0.jar

      - name: Run tests
        timeout-minutes: 10
        run: >-
          poetry run pytest dq/tests/ -v --tb=short
          --cov=dq --cov-branch --cov-report=term-missing
          --cov-report=xml --cov-report=json:coverage.json
          --cov-fail-under=${{ matrix.coverage_min }}
        env:
          SPARK_VERSION: "3.5"
      - name: Enforce independent line and branch floors
        if: matrix.python-version == '3.13'
        run: >-
          poetry run python scripts/check_coverage.py coverage.json
          --min-line 57 --min-branch 46
      - name: Enforce changed-code coverage
        if: matrix.python-version == '3.13'
        run: >-
          poetry run diff-cover coverage.xml
          --compare-branch=origin/${{ github.event.pull_request.base.ref }}
          --fail-under=90

  dependency-review:
    name: Owner dependency review
    needs: authorize-owner
    runs-on: [self-hosted, Linux, X64, public-overflow]
    timeout-minutes: 10
    steps:
      - name: Check out the exact trusted PR revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          clean: true
      - name: Check documentation links
        env:
          LYCHEE_ARCHIVE_SHA256: 73657a111819a30c47c08352896796f23d64e4eb2b3ed39b6d32149241566fc5
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/lychee-x86_64-unknown-linux-musl.tar.gz"
          install_dir="${RUNNER_TEMP}/lychee-v0.24.2"
          curl --fail --location --retry 3 --output "${archive}" \
            https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-musl.tar.gz
          printf '%s  %s\n' "${LYCHEE_ARCHIVE_SHA256}" "${archive}" | sha256sum --check --strict
          rm -rf "${install_dir}"
          mkdir -p "${install_dir}"
          tar -xzf "${archive}" --strip-components=1 -C "${install_dir}"
          "${install_dir}/lychee" --no-progress --root-dir . --max-retries 3 --timeout 30 \
            --exclude '^file:///(absolute/path|path/to)/' './**/*.md' './**/*.adoc'
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  owner-build:
    # Match the hosted aggregate context required by branch protection.
    name: build
    if: always() && needs.authorize-owner.result == 'success'
    needs: [authorize-owner, owner-lint, owner-test, dependency-review]
    runs-on: [self-hosted, Linux, X64, public-overflow]
    timeout-minutes: 20
    steps:
      - name: Verify required jobs
        env:
          LINT_RESULT: ${{ needs.owner-lint.result }}
          TEST_RESULT: ${{ needs.owner-test.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
        run: |
          set -euo pipefail
          test "${LINT_RESULT}" = "success"
          test "${TEST_RESULT}" = "success"
          test "${DEPENDENCY_REVIEW_RESULT}" = "success"
      - name: Verify trusted PR identity
        env:
          ACTOR_ID: ${{ github.actor_id }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_AUTHOR_ID: ${{ github.event.pull_request.user.id }}
        run: |
          set -euo pipefail
          test "${ACTOR_ID}" = "${OWNER_GITHUB_USER_ID}"
          test "${PR_AUTHOR_ID}" = "${OWNER_GITHUB_USER_ID}"
          test "${HEAD_REPOSITORY}" = "${GITHUB_REPOSITORY}"

      - name: Check out the exact trusted PR revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          clean: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pip install poetry==2.4.2

      - name: Build package
        run: poetry build

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: owner-private-dist-${{ github.event.pull_request.head.sha }}
          path: dist/
