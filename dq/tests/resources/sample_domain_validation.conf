# Sample domain validation configuration for tests
dqframework {
  dqrules = [
    {
      name = "sample_domain_validation"
      engine = "deequ"
      dataframes = ["default"]
      checks = [
        {
          constraint_name = "date_complete"
          constraint = "isComplete"
          column = "record_date"
          level = "Error"
        }
        {
          constraint_name = "batch_complete"
          constraint = "isComplete"
          column = "batch_id"
          level = "Error"
        }
        {
          constraint_name = "region_complete"
          constraint = "isComplete"
          column = "region_id"
          level = "Error"
        }
        {
          constraint_name = "measure_01_non_negative"
          constraint = "isNonNegative"
          column = "measure_01"
          level = "Warning"
        }
        {
          constraint_name = "measure_02_non_negative"
          constraint = "isNonNegative"
          column = "measure_02"
          level = "Warning"
        }
      ]
    }
  ]
}
