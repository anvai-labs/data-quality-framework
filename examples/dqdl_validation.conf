# DQDL is a PyDeequ compatibility adapter. Prefer typed portable rules when available.
dqframework {
  dataframes {
    default = "catalog.schema.orders"
  }

  dqrules = [
    {
      name = "order_dqdl_checks"
      engine = "dqdl"
      dataframes = ["default"]
      ruleset = """
        Rules=[
          RowCount >= 1,
          IsComplete "order_id",
          ColumnValues "amount" >= 0
        ]
      """
    }
  ]
}
